<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magnet Beacon Light — JavaScript Animation</title>
  <style>
    :root{
      --bg:#0b1020;
      --mag-red:#ff4757;
      --mag-blue:#2ed573;
      --glow: #ffb86b;
    }
    html,body{height:100%;margin:0;background:var(--bg);display:grid;place-items:center;font-family:system-ui,Segoe UI,Roboto,Arial}
    .stage{width:680px;height:420px;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(180deg,#071022 0%, #081426 60%);box-shadow:0 10px 30px rgba(2,6,23,.7);padding:20px}

    /* Beacon (pulsing light) */
    .beacon{
      position:absolute;left:50%;transform:translateX(-50%);top:38px;width:72px;height:72px;border-radius:50%;
      display:grid;place-items:center;z-index:30;
    }
    .beacon .core{
      width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 25%, #fff, #fff6, rgba(255,200,120,.6) 40%, rgba(255,120,50,0.15) 70%);
      box-shadow:0 0 22px 6px rgba(255,160,80,.18), 0 0 44px 14px rgba(255,130,60,.06);
      animation: core-pulse 1.6s infinite ease-in-out;
    }
    .beacon::before{
      content:"";position:absolute;inset:0;filter:blur(20px);opacity:.55;background:conic-gradient(from 0deg, rgba(255,200,120,.18), rgba(255,140,40,.06));border-radius:50%;animation: spin 3s linear infinite;
    }
    @keyframes core-pulse{0%,100%{transform:scale(.95);opacity:.9}50%{transform:scale(1.18);opacity:1}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    /* Rings that pulse outward */
    .ring{position:absolute;left:50%;transform:translateX(-50%);top:72px;width:14px;height:14px;border-radius:50%;pointer-events:none}
    .ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,170,90,.18);animation: ring 2.8s infinite}
    .ring.r2::before{animation-delay:.6s}
    .ring.r3::before{animation-delay:1.2s}
    @keyframes ring{0%{transform:scale(.7);opacity:0.85}70%{opacity:.12}100%{transform:scale(11);opacity:0}}

    /* The magnet (SVG wrapper) */
    .mag-wrap{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;width:320px;height:200px;z-index:20}
    svg{width:100%;height:100%;overflow:visible}

    /* shine on magnet */
    .mag-body{filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}

    /* text label */
    .label{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:#c9d2ff88;font-size:13px}

    /* Controls small */
    .controls{position:absolute;right:14px;top:14px;color:#cfe3ff55;font-size:12px;display:flex;gap:8px;align-items:center}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.03);padding:6px 10px;border-radius:8px;cursor:pointer}

    /* responsive */
    @media (max-width:700px){.stage{width:92vw;height:56vw}.mag-wrap{width:62vw;height:36vw}}
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="beacon" id="beacon">
      <div class="core"></div>
    </div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>

    <canvas id="particles" style="position:absolute;inset:0;z-index:10;pointer-events:none"></canvas>

    <div class="mag-wrap">
      <!-- simple horseshoe magnet drawn with SVG -->
      <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="g1" x1="0" x2="1">
            <stop offset="0%" stop-color="#ff6b6b" />
            <stop offset="100%" stop-color="#ff9b72" />
          </linearGradient>
          <linearGradient id="g2" x1="0" x2="1">
            <stop offset="0%" stop-color="#66e0a3" />
            <stop offset="100%" stop-color="#3cd6a6" />
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="b" />
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- shadows -->
        <ellipse cx="160" cy="170" rx="110" ry="18" fill="rgba(0,0,0,.45)" />

        <!-- left leg -->
        <path class="mag-body" d="M64 60 C64 28,120 20,140 20 C160 20,216 28,216 60 L216 120 C216 140,200 152,180 152 L140 152" fill="none" stroke="url(#g1)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
        <!-- right leg -->
        <path class="mag-body" d="M256 60 C256 28,200 20,180 20 C160 20,104 20,104 60 L104 120 C104 140,120 152,140 152 L180 152" fill="none" stroke="url(#g2)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

        <!-- metal tips -->
        <path d="M64 60 C64 28,120 20,140 20" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.06" />

        <g id="shine" filter="url(#glow)">
          <circle cx="160" cy="16" r="12" fill="rgba(255,200,110,.35)" />
        </g>

      </svg>
    </div>

    <div class="label">Magnet Beacon — JavaScript + Canvas particles</div>

    <div class="controls">
      <div class="btn" id="toggle">Pause</div>
      <div style="font-size:11px;opacity:.7">Particles</div>
    </div>
  </div>

  <script>
    // simple particle system that are attracted to the beacon (magnetic effect)
    const canvas = document.getElementById('particles');
    const stage = document.getElementById('stage');
    const beacon = document.getElementById('beacon');
    const toggle = document.getElementById('toggle');
    let ctx = canvas.getContext('2d');
    let W, H, particles = [], running = true;

    function resize(){
      const r = stage.getBoundingClientRect();
      W = canvas.width = Math.floor(r.width);
      H = canvas.height = Math.floor(r.height);
      canvas.style.width = r.width+'px';
      canvas.style.height = r.height+'px';
    }
    window.addEventListener('resize', resize);
    resize();

    function rand(min,max){return Math.random()*(max-min)+min}

    function createParticles(n=120){
      particles = [];
      for(let i=0;i<n;i++){
        particles.push({
          x: rand(0,W), y: rand(0,H), vx: rand(-0.3,0.3), vy: rand(-0.3,0.3), r: rand(1,3), life: rand(50,300), hue: rand(20,50)
        })
      }
    }
    createParticles(140);

    function getBeaconPos(){
      const bRect = beacon.getBoundingClientRect();
      const sRect = stage.getBoundingClientRect();
      return {
        x: bRect.left - sRect.left + bRect.width/2,
        y: bRect.top - sRect.top + bRect.height/2
      }
    }

    let t = 0;
    function step(){
      if(!running){ requestAnimationFrame(step); return }
      t += 0.016;
      ctx.clearRect(0,0,W,H);
      const b = getBeaconPos();

      // draw mild field lines (for effect)
      for(let i=0;i<6;i++){
        const a = t*0.6 + i*(Math.PI*2/6);
        ctx.beginPath();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,160,70,0.03)';
        ctx.moveTo(b.x + Math.cos(a)*12, b.y + Math.sin(a)*12);
        ctx.lineTo(b.x + Math.cos(a)*300, b.y + Math.sin(a)*300);
        ctx.stroke();
      }

      for(let p of particles){
        // attraction force to beacon
        const dx = b.x - p.x; const dy = b.y - p.y;
        const dist = Math.max(12, Math.hypot(dx,dy));
        const force = Math.min(1800/(dist*dist), 0.9);
        p.vx += (dx/dist)*force*0.2 + rand(-0.02,0.02);
        p.vy += (dy/dist)*force*0.2 + rand(-0.02,0.02);

        // velocity damping
        p.vx *= 0.96; p.vy *= 0.96;
        p.x += p.vx; p.y += p.vy;

        // shrink near core and respawn
        if(dist < 18 || p.x< -20 || p.x>W+20 || p.y< -20 || p.y>H+20){
          p.x = rand(0,W); p.y = rand(H*0.7, H); p.vx = rand(-0.3,0.3); p.vy = rand(-1,-0.2);
        }

        // draw particle
        ctx.beginPath();
        const alpha = Math.max(0.12, Math.min(1, 0.9 - (dist/400)));
        ctx.fillStyle = `rgba(255,${Math.floor(170 - dist/2)},${Math.floor(80 + dist/6)},${alpha})`;
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
      }

      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    // Pause / resume
    toggle.addEventListener('click', ()=>{
      running = !running; toggle.textContent = running? 'Pause': 'Resume';
    });

    // small interactivity: move beacon with mouse over stage
    stage.addEventListener('mousemove', (e)=>{
      const r = stage.getBoundingClientRect();
      const mx = e.clientX - r.left;
      // nudge beacon toward mouse
      beacon.style.left = `${Math.min(r.width-40, Math.max(40, mx))}px`;
    });

    // initial gentle bob of beacon using CSS transform anim (via requestAnimationFrame tweaking)
    (function bob(){
      const core = document.querySelector('.beacon .core');
      let s = 0;
      function animate(){ s += 0.03; const y = Math.sin(s)*4; core.style.transform = `translateY(${y}px)`; requestAnimationFrame(animate); }
      requestAnimationFrame(animate);
    })();

  </script>
</body>
</html>
